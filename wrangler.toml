name = "ai-learning-library"
compatibility_date = "2024-11-12"
pages_build_output_dir = "dist"

# 说明：如果 Cloudflare Pages 控制台提示“此项目的绑定通过 wrangler.toml 管理”，
# 那么请在这里配置 KV / 环境变量，并用 wrangler 部署。

# KV：用于存储打卡记录
# 1) 运行：wrangler kv namespace create CHECKINS_KV
# 2) 运行：wrangler kv namespace create CHECKINS_KV --preview
# 3) 把输出的 id / preview_id 填到下面
kv_namespaces = [
	# { binding = "CHECKINS_KV", id = "<KV_NAMESPACE_ID>", preview_id = "<KV_PREVIEW_NAMESPACE_ID>" }
]

[vars]
# 非敏感变量可写这里；敏感信息建议用：wrangler pages secret put <NAME>
APP_URL = "https://aigbooks.pages.dev"
